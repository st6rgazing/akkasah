services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: akkasah-db
    environment:
      POSTGRES_DB: akkasah_archive
      POSTGRES_USER: akkasah_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-akkasah_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - akkasah-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akkasah_user -d akkasah_archive"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: akkasah-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - akkasah-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: akkasah-backend
    environment:
      - DATABASE_URL=postgresql://akkasah_user:${POSTGRES_PASSWORD:-akkasah_secure_password}@db:5432/akkasah_archive
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production-minimum-32-characters}
      - DEBUG=False
      - ENVIRONMENT=production
      - CORS_ORIGINS=["http://localhost:3000", "http://127.0.0.1:3000", "https://yourdomain.com"]
      - RATE_LIMIT_REQUESTS=100
      - RATE_LIMIT_WINDOW=60
      - MAX_FILE_SIZE=10485760
      - ALLOWED_FILE_EXTENSIONS=[".jpg", ".jpeg", ".png", ".gif", ".tiff", ".webp"]
      - UPLOAD_DIRECTORY=/app/uploads
      - LOG_LEVEL=INFO
      - LOG_FILE=/app/logs/akkasah.log
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    ports:
      - "8000:8000"
    networks:
      - akkasah-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: akkasah-frontend
    ports:
      - "80:80"
      - "443:443"
    networks:
      - akkasah-network
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: akkasah-nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - akkasah-network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local

networks:
  akkasah-network:
    driver: bridge
